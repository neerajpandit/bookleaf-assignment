openapi: 3.0.3
info:
  title: BookLeaf Author Support API
  version: 1.0.0
  description: |
    REST API for the BookLeaf Publishing Author Support & Communication Portal.

    ## Authentication

    Browser clients authenticate with an **HttpOnly cookie** (`bookleaf_access_token`)
    containing a signed JWT. The JWT is not returned in JSON response bodies.

    State-changing authentication requests require CSRF protection using:
    - `GET /api/v1/auth/csrf-token`
    - Header: `x-csrf-token`
    - Cookie: `bookleaf_csrf`

    Frontend requests must use credentialed CORS (`credentials: 'include'`) against
    the configured `CLIENT_URL` origin.

    Proposed but not yet implemented endpoints are listed in
    `docs/api/endpoint-inventory.md`.

servers:
  - url: http://localhost:5000
    description: Local development (default port from PORT env variable)
  - url: /
    description: Relative to the current host

tags:
  - name: System
    description: Application readiness and infrastructure endpoints
  - name: Authentication
    description: Registration, login, session, and profile endpoints
  - name: Books
    description: Author book catalog endpoints
  - name: Tickets
    description: Author support ticket endpoints
  - name: Admin Tickets
    description: Administrator ticket queue and management endpoints
  - name: Admin Authors
    description: Administrator author directory and profile endpoints

