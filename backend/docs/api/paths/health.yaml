get:
  tags:
    - System
  summary: Application health check
  description: |
    Readiness endpoint that reports process uptime and MongoDB connection status.

    Returns HTTP 200 when the application is running and MongoDB is connected.
    Returns HTTP 503 when MongoDB is unavailable.

    This endpoint is public and does not require authentication.
  operationId: getHealth
  responses:
    '200':
      description: Service is healthy and MongoDB is connected
      content:
        application/json:
          schema:
            $ref: '../components/schemas/common.yaml#/HealthSuccessResponse'
          example:
            success: true
            statusCode: 200
            message: Service is healthy
            data:
              uptime: 12.345
              database: connected
    '503':
      description: Service unavailable because MongoDB is disconnected
      content:
        application/json:
          schema:
            $ref: '../components/schemas/common.yaml#/HealthUnavailableResponse'
          example:
            success: false
            statusCode: 503
            message: Service unavailable
            data:
              uptime: 12.345
              database: disconnected
