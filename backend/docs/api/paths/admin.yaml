/queue:
  get:
    tags:
      - Admin Tickets
    summary: List the admin ticket queue
    description: |
      Returns a paginated, filterable ticket queue for administrators.

      Filters are applied in MongoDB before pagination. Use `assignedTo=unassigned`
      to retrieve tickets without an assignee.

      Search matches ticket number, subject, and author name/email.

      Use `authorId` to filter by the author's MongoDB User `_id` (24-character hex).
    operationId: listAdminTicketQueue
    security:
      - CookieAuth: []
    parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: status
        in: query
        schema:
          type: string
          enum:
            - OPEN
            - IN_PROGRESS
            - RESOLVED
            - CLOSED
      - name: category
        in: query
        schema:
          type: string
          enum:
            - Royalty & Payments
            - ISBN & Metadata Issues
            - Printing & Quality
            - Distribution & Availability
            - Book Status & Production Updates
            - General Inquiry
      - name: priority
        in: query
        schema:
          type: string
          enum:
            - CRITICAL
            - HIGH
            - MEDIUM
            - LOW
      - name: assignedTo
        in: query
        schema:
          oneOf:
            - type: string
              enum:
                - unassigned
            - type: string
              pattern: '^[a-f0-9]{24}$'
      - name: dateFrom
        in: query
        schema:
          type: string
          format: date-time
      - name: dateTo
        in: query
        schema:
          type: string
          format: date-time
      - name: search
        in: query
        schema:
          type: string
          maxLength: 200
      - name: authorId
        in: query
        schema:
          type: string
          pattern: '^[a-f0-9]{24}$'
        description: Filter tickets by the author's MongoDB User `_id`
      - name: aiProcessingStatus
        in: query
        schema:
          type: string
          enum:
            - PENDING
            - IN_PROGRESS
            - COMPLETED
            - FAILED
            - SKIPPED
        description: Filter tickets by AI processing lifecycle status
    responses:
      '200':
        description: Admin ticket queue
        content:
          application/json:
            schema:
              $ref: '../components/schemas/adminTicket.yaml#/AdminTicketQueueResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        description: Authentication required or invalid session
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth.yaml#/UnauthorizedResponse'
      '403':
        description: Authenticated user is not an administrator
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth.yaml#/ForbiddenResponse'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

