/ai-draft:
  post:
    tags:
      - Admin Tickets
    summary: Regenerate AI draft response
    description: |
      Re-runs AI analysis for the ticket using the configured provider.
      Operational category and priority overrides are preserved; AI fields are refreshed.
      Requires AI_PROVIDER and provider credentials to be configured.
    operationId: regenerateAdminTicketAiDraft
    security:
      - CookieAuth: []
    parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-f0-9]{24}$'
    responses:
      '200':
        description: AI draft regenerated
        content:
          application/json:
            schema:
              $ref: '../components/schemas/adminTicket.yaml#/AdminAiDraftResponse'
      '401':
        description: Authentication required or invalid session
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth.yaml#/UnauthorizedResponse'
      '403':
        description: Authenticated user is not an administrator
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth.yaml#/ForbiddenResponse'
      '404':
        description: Ticket not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/NotFoundResponse'
      '502':
        description: AI provider request failed
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '503':
        description: AI processing is not configured
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

