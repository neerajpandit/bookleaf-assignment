/messages:
  get:
    tags:
      - Admin Tickets
    summary: List public ticket messages
    description: |
      Returns paginated public conversation messages for a ticket.

      Internal notes are never included in this response.
    operationId: listAdminTicketMessages
    security:
      - CookieAuth: []
    parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-f0-9]{24}$'
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
    responses:
      '200':
        description: Public ticket messages
        content:
          application/json:
            schema:
              $ref: '../components/schemas/adminTicket.yaml#/AdminMessageListResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        description: Authentication required or invalid session
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth.yaml#/UnauthorizedResponse'
      '403':
        description: Authenticated user is not an administrator
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth.yaml#/ForbiddenResponse'
      '404':
        description: Ticket not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/NotFoundResponse'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'
  post:
    tags:
      - Admin Tickets
    summary: Send a public admin reply
    description: |
      Adds a public reply to the ticket conversation visible to the author.

      Closed tickets reject new replies. Ticket status is not changed automatically.
    operationId: sendAdminTicketReply
    security:
      - CookieAuth: []
    parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-f0-9]{24}$'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/adminTicket.yaml#/AdminPublicReplyRequest'
    responses:
      '201':
        description: Public reply created
        content:
          application/json:
            schema:
              $ref: '../components/schemas/adminTicket.yaml#/AdminPublicReplyResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        description: Authentication required or invalid session
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth.yaml#/UnauthorizedResponse'
      '403':
        description: Authenticated user is not an administrator
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth.yaml#/ForbiddenResponse'
      '404':
        description: Ticket not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/NotFoundResponse'
      '409':
        description: Ticket is closed and cannot accept new messages
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

