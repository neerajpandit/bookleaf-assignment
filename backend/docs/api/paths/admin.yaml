/status:
  patch:
    tags:
      - Admin Tickets
    summary: Update ticket status
    description: |
      Updates ticket status using the documented admin transition policy.
      Sets `resolvedAt` when entering RESOLVED and `closedAt` when entering CLOSED.
      CLOSED is terminal.
    operationId: updateAdminTicketStatus
    security:
      - CookieAuth: []
    parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-f0-9]{24}$'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/adminTicket.yaml#/AdminTicketStatusRequest'
    responses:
      '200':
        description: Ticket status updated
        content:
          application/json:
            schema:
              $ref: '../components/schemas/adminTicket.yaml#/AdminTicketUpdateResponse'
      '400':
        description: Invalid status transition or request body
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '401':
        description: Authentication required or invalid session
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth.yaml#/UnauthorizedResponse'
      '403':
        description: Authenticated user is not an administrator
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth.yaml#/ForbiddenResponse'
      '404':
        description: Ticket not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/NotFoundResponse'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

